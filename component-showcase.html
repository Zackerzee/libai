<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIBMS · 组件与交互样板</title><link rel="stylesheet" href="./styles/tokens.css"><link rel="stylesheet" href="./styles/studio-system.css"></head><body><main class="studio-showcase"><a href="./index.html">← 返回网站</a><p>LIBMS DESIGN SYSTEM</p><h1>安静的界面，明确的反馈。</h1><p>这是一页可操作的组件样板，不修改图纸或工程。</p>
<section><h2>操作层级</h2><div class="row"><button class="primary" id="apply">应用设置</button><button id="preview">预览</button><button disabled>暂不可用</button><output id="feedback" aria-live="polite">等待操作</output></div></section>
<section><h2>工具切换</h2><div class="row" id="tools"><button aria-pressed="true">画笔</button><button aria-pressed="false">选择</button><button aria-pressed="false">文字</button></div><p id="tool-options">画笔 · 笔宽 / 笔触 / 对称</p></section>
<section><h2>设置与即时反馈</h2><div class="row"><label>作品名称 <input placeholder="输入作品名称"></label><label>输出质量 <select><option>高清 · 48px/格</option><option>标准 · 24px/格</option></select></label><label>强度 <input id="intensity" type="range" min="0" max="100" value="35"><output id="intensity-value">35%</output></label></div></section>
<section><h2>菜单与退出</h2><div class="row"><details id="menu"><summary>编辑操作</summary><div><button id="menu-action">执行示例动作</button><p>选择后收起，外点或 Esc 退出。</p></div></details><button id="dialog-open">打开确认弹窗</button></div></section>
<dialog id="dialog"><h2>预览已准备好</h2><p>这是组件示例，不会更改你的工程。</p><form method="dialog"><button>返回</button><button class="primary" value="apply">应用</button></form></dialog></main>
<script type="module">import{createSurfaceManager}from './ui/surface-manager.js';const $=s=>document.querySelector(s),menu=$('#menu'),manager=createSurfaceManager({document});manager.register('menu',{element:menu,isOpen:()=>menu.open,close:()=>menu.open=false,restoreFocus:()=>menu.querySelector('summary').focus()});menu.addEventListener('toggle',()=>{if(menu.open)manager.open('menu')});$('#menu-action').onclick=()=>{manager.close('menu',true);$('#feedback').textContent='示例动作已完成'};$('#apply').onclick=()=>$('#feedback').textContent='设置已应用';$('#preview').onclick=()=>$('#feedback').textContent='正在显示预览';$('#tools').onclick=e=>{if(e.target.tagName!=='BUTTON')return;for(const b of $('#tools').children)b.setAttribute('aria-pressed',String(b===e.target));$('#tool-options').textContent={画笔:'画笔 · 笔宽 / 笔触 / 对称',选择:'选择 · 范围 / 追加 / 减选',文字:'文字 · 内容 / 字号 / 间距'}[e.target.textContent]};$('#intensity').oninput=e=>$('#intensity-value').textContent=e.target.value+'%';$('#dialog-open').onclick=()=>$('#dialog').showModal();</script></body></html>
